<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health Sciences Career Explorer</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <h1>Health Sciences Career Explorer</h1>

    <p class="subtitle">What speaks to you?</p>

    <p class="instructions">
      Select as many as you like.
    </p>

    <div class="interests">

      <button type="button" class="interest-button">
        🧩 I like solving problems.
      </button>

      <button type="button" class="interest-button">
        📊 I like working with data.
      </button>

      <button type="button" class="interest-button">
        💻 I like technology.
      </button>

      <button type="button" class="interest-button">
        🧑‍🤝‍🧑 I like helping people.
      </button>

      <button type="button" class="interest-button">
        🌎 I care about improving communities.
      </button>

      <button type="button" class="interest-button">
        🔬 I like research.
      </button>

      <button type="button" class="interest-button">
        📋 I like organizing projects and systems.
      </button>

    </div>

    <button type="button" class="explore-button">
      Explore Careers →
    </button>

    <div id="results" class="results"></div>

  </main>

  <script src="script.js"></script>

</body>
</html>
